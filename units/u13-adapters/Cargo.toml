[package]
name = "u13-adapters"
version = "0.1.0"
edition = "2021"

[lib]
name = "u13_adapters"
path = "src/lib.rs"

[dependencies]
pathn-contracts = { path = "../../contracts" }

# Track A: the real WebGPU canvas adapter is wasm32-only. Native builds keep
# this crate's portable mocks; the quarantine source-scan (lib.rs) is
# unaffected because the browser bindings live in their own module file.
[target.'cfg(target_arch = "wasm32")'.dependencies]
virtio_gpu_bridge = { path = "../../crates/virtio_gpu_bridge" }
gles2wgpu = { path = "../../crates/gles2wgpu" }
u8-gpu-host = { path = "../u8-gpu-host" }
wgpu = { workspace = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = "0.3"
