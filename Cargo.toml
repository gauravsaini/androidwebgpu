[workspace]
resolver = "2"
members = [
    "crates/gles2wgpu",
    "crates/virtio_gpu_bridge",
    "crates/webgpu_compositor",
    "crates/webgpu_swapchain",
    "crates/apk_gpu_analyzer",
    "crates/metrics_overlay",
    "contracts",
  "units/u1-decode",
  "units/u2-ir-lift",
  "units/u3-wasm-jit",
  "units/u11-snapshot",
  "units/u10-analyzer",
  "units/u14-metrics",
  "units/u4-mmu",
  "units/u5-gic-timer",
  "units/u6-virtio-transport",
  "units/u7-gpu-device",
  "units/u8-gpu-host",
]

[workspace.dependencies]
wgpu = "24.0"
naga = { version = "24.0", features = ["glsl-in", "wgsl-out"] }
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
