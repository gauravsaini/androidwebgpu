[package]
name = "virtio_gpu_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gles2wgpu = { path = "../gles2wgpu" }
vulkan2wgpu = { path = "../vulkan2wgpu" }
virtio_binder = { path = "../virtio_binder" }
binder_rt = { path = "../binder_rt" }
aidl_compat = { path = "../aidl_compat" }
binder_handle_bridge = { path = "../binder_handle_bridge" }
binder_routing = { path = "../binder_routing" }
surfaceflinger_gpu_service = { path = "../surfaceflinger_gpu_service" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook"]

